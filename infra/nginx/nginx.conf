worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Pas de version nginx dans les en-tetes/erreurs : rien d'utile a un attaquant.
    server_tokens off;

    # Delais courts pour limiter l'impact d'un client lent/malveillant (type slowloris) qui
    # ouvrirait des connexions sans jamais finir d'envoyer sa requete.
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;
    keepalive_timeout     15s;

    # Aucun corps de requete demesure : le plus gros corps legitime est un JSON de scoring,
    # largement sous 1 Mo.
    client_max_body_size 1m;

    # Limitation de debit : defense en profondeur au-dessus du verrouillage applicatif
    # (5 echecs / 15 min, cote API) et frein generique contre un afflux de requetes.
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=connexion:10m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=connexions_par_ip:10m;

    # Le domaine public passe par un tunnel Cloudflare (cloudflared) vers ce nginx local : le
    # pair TCP que nginx voit est toujours cloudflared en local (loopback ou passerelle du
    # reseau Docker), jamais une IP publique Cloudflare — contrairement au cas du proxy direct
    # documente par Cloudflare. Sans ceci, $binary_remote_addr (rate-limiting ci-dessus) et
    # X-Real-IP (journal d'audit cote API) valent la meme adresse locale pour tous les
    # visiteurs, quelle que soit leur IP reelle. Cloudflare ajoute CF-Connecting-IP a toute
    # requete proxyee, y compris via un tunnel ; on ne le fait confiance que si la connexion
    # vient bien de cloudflared en local (127.0.0.1) ou du reseau Docker (172.16.0.0/12 couvre
    # le sous-reseau bridge auto-attribue, non epingle dans docker-compose.yml).
    set_real_ip_from 127.0.0.1/32;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    server {
        listen 80;
        server_name _;

        limit_req zone=general burst=40 nodelay;
        limit_conn connexions_par_ip 20;

        # Ignores par les navigateurs si recus en clair (HSTS n'a d'effet que sur une reponse
        # effectivement recue en HTTPS) : sans danger a poser sans condition ici, meme si ce
        # nginx sert aussi du HTTP simple en local. Pas de redirection HTTP->HTTPS ajoutee dans
        # ce fichier : le domaine public passe par un tunnel Cloudflare vers ce meme nginx local ;
        # une redirection dure ici risquerait une boucle si le tunnel parle HTTP en interne.
        # Le basculement force HTTP->HTTPS releve du tableau de bord Cloudflare ("Always Use
        # HTTPS"), hors de ce depot. 'unsafe-inline' sur script-src/style-src : le App Router de
        # Next.js injecte des <script> inline pour l'hydratation RSC (self.__next_f.push(...)) et
        # l'UI utilise des attributs style="" inline - un CSP a base de nonce l'interdirait et
        # forcerait un rendu 100% dynamique, disproportionne ici. Recette "sans nonce"
        # recommandee par la doc officielle Next.js (nextjs.org/docs/app/guides/
        # content-security-policy, verifiee sur la version 16.3.5 utilisee par ce projet).
        include /etc/nginx/securite-communes.conf;

        location = /api/v1/auth/connexion {
            limit_req zone=connexion burst=5 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/ {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            proxy_pass http://front:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # Site sociétaire (self-service), port distinct du site agence : deux sites separement
    # deployables, cf. PLAN 72H/SOLIDA_Flux_Societaire.md. Meme backend "api" que le site
    # agence (un seul referentiel de donnees), routage identique pour /api/v1/.
    server {
        listen 8080;
        server_name _;

        limit_req zone=general burst=40 nodelay;
        limit_conn connexions_par_ip 20;

        include /etc/nginx/securite-communes.conf;

        location /api/v1/ {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            proxy_pass http://front-societaire:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
