[project]
name = "solida-backend"
version = "0.1.0"
description = "API de scoring d'octroi SOLIDA (hors entrainement du modele ML)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "psycopg[binary]==3.3.4",
    "fastapi-users[sqlalchemy]==15.0.5",
    "argon2-cffi==25.1.0",
    "uvicorn[standard]==0.52.1",
    "weasyprint==69.0",
    "jinja2==3.1.6",
    "minio==7.2.20",
    "interpret-core==0.7.8",
    "joblib>=1.5,<2",
    "mlflow-skinny==3.16.0",
    "pandas==3.0.5",
    "solida-modelisation",
]

[tool.uv.sources]
solida-modelisation = { path = "../modelisation", editable = false }

[dependency-groups]
dev = [
    "ruff==0.16.1",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "import-linter==2.13",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "solida.infrastructure.auth.dependencies.require_role",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "weasyprint"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "solida_modelisation.*"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["solida.domain.*", "solida.application.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=solida --cov-report=term-missing"

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]

[tool.importlinter]
root_package = "solida"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Couches Clean Architecture"
type = "layers"
layers = [
    "solida.infrastructure",
    "solida.adapters",
    "solida.application",
    "solida.domain",
]

[[tool.importlinter.contracts]]
name = "Le domaine n'importe aucune bibliotheque tierce hors Pydantic"
type = "forbidden"
source_modules = ["solida.domain"]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "alembic",
    "psycopg",
    "fastapi_users",
    "uvicorn",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solida"]
