services:
  front:
    build:
      context: ./frontend
      target: runner
    env_file:
      - ./frontend/.env
    environment:
      BACKEND_INTERNAL_URL: http://api:8000
      # Sans ceci, le serveur standalone Next.js se lie a la valeur de HOSTNAME que Docker
      # positionne automatiquement (l'ID du conteneur, resolu sur l'IP reseau) plutot que
      # 0.0.0.0 — nginx le joint tout de meme via cette IP, mais le healthcheck local
      # ("localhost" = 127.0.0.1 depuis l'interieur du conteneur) echoue.
      HOSTNAME: "0.0.0.0"
    networks:
      - solida
    depends_on:
      api:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health').then(r=>{if(!r.ok)throw 0}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  # Site sociétaire (self-service), coquille UI cf. PLAN 72H/SOLIDA_Flux_Societaire.md.
  # Meme construction que "front", conteneur separe : sessions incompatibles (pas de
  # compte agent), et site distinct a exposer separement du site agence (voir le
  # second server block de infra/nginx/nginx.conf, port 8080).
  front-societaire:
    build:
      context: ./frontend-societaire
      target: runner
    environment:
      BACKEND_INTERNAL_URL: http://api:8000
      HOSTNAME: "0.0.0.0"
    networks:
      - solida
    depends_on:
      api:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health').then(r=>{if(!r.ok)throw 0}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  front-societaire-dev:
    build:
      context: ./frontend-societaire
      target: dev
    environment:
      BACKEND_INTERNAL_URL: http://api:8000
    volumes:
      - ./frontend-societaire:/app
      - front_societaire_node_modules:/app/node_modules
      - front_societaire_next_cache:/app/.next
    networks:
      - solida
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - dev

  # Uniquement pour le developpement local (make front-dev, front-install, ...) : jamais
  # demarre par un simple "docker compose up" et jamais route par nginx. Next.js en mode
  # "next dev" ne doit pas etre expose derriere le reverse proxy, meme en demo (audit F2).
  front-dev:
    build:
      context: ./frontend
      target: dev
    env_file:
      - ./frontend/.env
    environment:
      BACKEND_INTERNAL_URL: http://api:8000
    volumes:
      - ./frontend:/app
      - front_node_modules:/app/node_modules
      - front_next_cache:/app/.next
    networks:
      - solida
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - dev

  # Uniquement pour le developpement local (make back-lint, back-typecheck, back-test,
  # back-imports, ...) : jamais demarre par un simple "docker compose up", jamais route par
  # nginx. Bind-mount du code source (comme front-dev) pour eviter un rebuild d'image a
  # chaque iteration ; le volume nomme back_venv preserve le venv construit par l'image sous
  # le bind-mount, meme role que front_node_modules/front_next_cache pour le frontend.
  # ENVIRONNEMENT force a "developpement" (independamment de la valeur de .env, qui vaut
  # "production" pour le service "api") : sinon les cookies de session Secure font echouer
  # les tests d'integration en cascade avec des 401.
  api-dev:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SOLIDA_DATABASE_URL: ${SOLIDA_DATABASE_URL}
      SOLIDA_DATABASE_URL_ASYNC: ${SOLIDA_DATABASE_URL_ASYNC}
      SOLIDA_PURGE_DATABASE_URL: ${SOLIDA_PURGE_DATABASE_URL}
      CORESIM_DATABASE_URL: ${CORESIM_DATABASE_URL}
      SECRET_AUTH: ${SECRET_AUTH}
      ENVIRONNEMENT: developpement
      SEAWEEDFS_ENDPOINT: seaweedfs:8333
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY}
      SEAWEEDFS_BUCKET: solida-fiches
      MODELE_SOCLE_PATH: /app/modeles/bundle_socle
      MODELE_SOCLE_CACHE_PATH: /var/cache/solida-modele
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
      MLFLOW_MODEL_NAME: ${MLFLOW_MODEL_NAME:-solida-socle}
      MLFLOW_MODEL_ALIAS: ${MLFLOW_MODEL_ALIAS:-champion-demo}
    volumes:
      - ./backend:/app/backend
      - ./modelisation/data/modeles/bundle_socle:/app/modeles/bundle_socle:ro
      - back_venv:/app/backend/.venv
      - modele_socle_cache:/var/cache/solida-modele
    networks:
      - solida
    depends_on:
      postgres-solida:
        condition: service_healthy
      postgres-coresim:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    profiles:
      - dev

  postgres-coresim:
    image: postgres:16.14
    # `-c timezone=UTC` plutot que la variable d'environnement TZ : initdb ne fixe le GUC
    # timezone qu'a la creation du volume de donnees, un TZ pose apres coup sur un volume
    # deja initialise n'aurait aucun effet. Le flag de ligne de commande s'applique a chaque
    # demarrage, quel que soit l'age du volume.
    command: postgres -c timezone=UTC
    environment:
      POSTGRES_DB: coresim
      POSTGRES_USER: ${CORESIM_ADMIN_USER}
      POSTGRES_PASSWORD: ${CORESIM_ADMIN_PASSWORD}
      SOLIDA_LECTEUR_PASSWORD: ${SOLIDA_LECTEUR_PASSWORD}
    volumes:
      - pgdata_coresim:/var/lib/postgresql/data
      - ./infra/postgres/coresim-init.sh:/docker-entrypoint-initdb.d/coresim-init.sh:ro
    networks:
      - solida
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # cap_drop/security_opt non appliques : l'entrypoint officiel Postgres a besoin de
    # CAP_CHOWN/CAP_SETUID pour demarrer en root puis basculer sur l'utilisateur postgres.
    # Isolation reelle assuree par le reseau interne (aucun port publie) et les roles a
    # privilege minimal.

  postgres-solida:
    image: postgres:16.14
    # Voir le commentaire equivalent sur postgres-coresim : flag de ligne de commande, pas
    # la variable TZ, pour un effet garanti meme sur un volume de donnees deja initialise.
    command: postgres -c timezone=UTC
    environment:
      POSTGRES_DB: solida
      POSTGRES_USER: ${SOLIDA_APP_USER}
      POSTGRES_PASSWORD: ${SOLIDA_APP_PASSWORD}
      SOLIDA_LECTURE_PASSWORD: ${SOLIDA_LECTURE_PASSWORD}
      SOLIDA_PURGE_PASSWORD: ${SOLIDA_PURGE_PASSWORD}
    volumes:
      - pgdata_solida:/var/lib/postgresql/data
      - ./infra/postgres/solida-init.sh:/docker-entrypoint-initdb.d/solida-init.sh:ro
    networks:
      - solida
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.40
    entrypoint: ["sh", "-c"]
    command:
      - |
        mkdir -p /etc/seaweedfs && cat > /etc/seaweedfs/s3.json <<EOF
        {"identities":[{"name":"solida","credentials":[{"accessKey":"$$SEAWEEDFS_ACCESS_KEY","secretKey":"$$SEAWEEDFS_SECRET_KEY"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        EOF
        exec weed server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=256
    environment:
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY}
    volumes:
      - seaweedfs_data:/data
    networks:
      - solida
    # cap_drop non applique : /data et /etc/seaweedfs appartiennent a l'utilisateur "seaweed"
    # dans l'image, pas root — l'entrypoint (qui ecrit s3.json puis demarre "weed" en root)
    # a besoin de CAP_DAC_OVERRIDE pour y ecrire malgre tout. Meme cas que les Postgres
    # ci-dessus. Isolation reelle assuree par le reseau interne (port non publie a l'hote).

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SOLIDA_DATABASE_URL: ${SOLIDA_DATABASE_URL}
      SOLIDA_DATABASE_URL_ASYNC: ${SOLIDA_DATABASE_URL_ASYNC}
      SOLIDA_PURGE_DATABASE_URL: ${SOLIDA_PURGE_DATABASE_URL}
      CORESIM_DATABASE_URL: ${CORESIM_DATABASE_URL}
      SECRET_AUTH: ${SECRET_AUTH}
      ENVIRONNEMENT: ${ENVIRONNEMENT}
      SEAWEEDFS_ENDPOINT: seaweedfs:8333
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY}
      SEAWEEDFS_BUCKET: solida-fiches
      MODELE_SOCLE_PATH: /app/modeles/bundle_socle
      MODELE_SOCLE_CACHE_PATH: /var/cache/solida-modele
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
      MLFLOW_MODEL_NAME: ${MLFLOW_MODEL_NAME:-solida-socle}
      MLFLOW_MODEL_ALIAS: ${MLFLOW_MODEL_ALIAS:-champion-demo}
    volumes:
      - ./modelisation/data/modeles/bundle_socle:/app/modeles/bundle_socle:ro
      - modele_socle_cache:/var/cache/solida-modele
    networks:
      - solida
    depends_on:
      postgres-solida:
        condition: service_healthy
      postgres-coresim:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  nginx:
    image: nginx:1.30.4-alpine
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/securite-communes.conf:/etc/nginx/securite-communes.conf:ro
    networks:
      - solida
    depends_on:
      front:
        condition: service_healthy
      front-societaire:
        condition: service_healthy
      api:
        condition: service_healthy
    # cap_drop non applique : l'entrypoint officiel doit chown /var/cache/nginx/* vers
    # l'utilisateur nginx avant de demarrer, ce qui exige CAP_CHOWN. Meme cas que les
    # Postgres ci-dessus.
    healthcheck:
      # 127.0.0.1, pas "localhost" : wget le resout en ::1 dans l'image alpine, or nginx.conf
      # n'ecoute qu'en IPv4 (`listen 80;` sans le pendant [::]:80) — service reellement sain,
      # healthcheck faussement rouge sinon.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/v1/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  coresim-seed:
    build:
      context: ./simulateur
    environment:
      DATABASE_URL: postgresql://${CORESIM_ADMIN_USER}:${CORESIM_ADMIN_PASSWORD}@postgres-coresim:5432/coresim
    networks:
      - solida
    depends_on:
      postgres-coresim:
        condition: service_healthy
    profiles:
      - tools

  # Services MLOps explicites : ils restent éteints hors profil `mlops` et ne modifient ni
  # CORE-SIM ni la base applicative SOLIDA. Les métadonnées MLflow vivent dans leur propre
  # PostgreSQL, les artefacts et cache DVC dans SeaweedFS.
  postgres-mlflow:
    image: postgres:16.14
    command: postgres -c timezone=UTC
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: ${MLFLOW_DB_USER}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD}
    volumes:
      - pgdata_mlflow:/var/lib/postgresql/data
    networks:
      - solida
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - mlops

  mlops-init:
    build:
      context: .
      dockerfile: modelisation/Dockerfile
    entrypoint: ["python"]
    command:
      - -c
      - |
        import os
        import boto3
        from botocore.exceptions import ClientError
        client = boto3.client(
            "s3",
            endpoint_url="http://seaweedfs:8333",
            aws_access_key_id=os.environ["SEAWEEDFS_ACCESS_KEY"],
            aws_secret_access_key=os.environ["SEAWEEDFS_SECRET_KEY"],
        )
        for bucket in ("dvc-cache", "mlflow"):
            try:
                client.head_bucket(Bucket=bucket)
            except ClientError:
                client.create_bucket(Bucket=bucket)
    environment:
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY}
    networks:
      - solida
    depends_on:
      seaweedfs:
        condition: service_started
    profiles:
      - mlops

  mlflow:
    build:
      context: .
      dockerfile: modelisation/Dockerfile
    entrypoint: ["sh", "-ec"]
    command:
      - >-
        mlflow server --host 0.0.0.0 --port 5000
        --backend-store-uri "$${MLFLOW_BACKEND_STORE_URI}"
        --default-artifact-root s3://mlflow
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg://${MLFLOW_DB_USER}:${MLFLOW_DB_PASSWORD}@postgres-mlflow:5432/mlflow
      MLFLOW_S3_ENDPOINT_URL: http://seaweedfs:8333
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY}
    networks:
      - solida
    depends_on:
      postgres-mlflow:
        condition: service_healthy
      mlops-init:
        condition: service_completed_successfully
    profiles:
      - mlops

# Seul nginx publie un port sur l'hote (80) : front et api ne sont joignables que par le
# reseau interne "solida", pareil pour postgres et seaweedfs. Pas de TLS ici (usage LAN/demo
# de hackathon assume) : a ajouter (certificat + Strict-Transport-Security) avant tout
# deploiement reel, voir docs/backend/03-decisions-provisoires-a-revoir.md.

volumes:
  front_node_modules:
  front_next_cache:
  front_societaire_node_modules:
  front_societaire_next_cache:
  back_venv:
  pgdata_coresim:
  pgdata_solida:
  pgdata_mlflow:
  seaweedfs_data:
  modele_socle_cache:

networks:
  solida:
    driver: bridge
