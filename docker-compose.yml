services:
  front:
    build:
      context: ./frontend
      target: dev
    env_file:
      - ./frontend/.env
    environment:
      BACKEND_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - front_node_modules:/app/node_modules
      - front_next_cache:/app/.next
    networks:
      - solida
    depends_on:
      api:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/sante').then(r=>{if(!r.ok)throw 0}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  postgres-coresim:
    image: postgres:16.14
    environment:
      POSTGRES_DB: coresim
      POSTGRES_USER: ${CORESIM_ADMIN_USER}
      POSTGRES_PASSWORD: ${CORESIM_ADMIN_PASSWORD}
      SOLIDA_LECTEUR_PASSWORD: ${SOLIDA_LECTEUR_PASSWORD}
    volumes:
      - pgdata_coresim:/var/lib/postgresql/data
      - ./infra/postgres/coresim-init.sh:/docker-entrypoint-initdb.d/coresim-init.sh:ro
    networks:
      - solida
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # cap_drop/security_opt non appliques : l'entrypoint officiel Postgres a besoin de
    # CAP_CHOWN/CAP_SETUID pour demarrer en root puis basculer sur l'utilisateur postgres.
    # Isolation reelle assuree par le reseau interne (aucun port publie) et les roles a
    # privilege minimal.

  postgres-solida:
    image: postgres:16.14
    environment:
      POSTGRES_DB: solida
      POSTGRES_USER: ${SOLIDA_APP_USER}
      POSTGRES_PASSWORD: ${SOLIDA_APP_PASSWORD}
      SOLIDA_LECTURE_PASSWORD: ${SOLIDA_LECTURE_PASSWORD}
    volumes:
      - pgdata_solida:/var/lib/postgresql/data
      - ./infra/postgres/solida-init.sh:/docker-entrypoint-initdb.d/solida-init.sh:ro
    networks:
      - solida
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      SOLIDA_DATABASE_URL: ${SOLIDA_DATABASE_URL}
      SOLIDA_DATABASE_URL_ASYNC: ${SOLIDA_DATABASE_URL_ASYNC}
      CORESIM_DATABASE_URL: ${CORESIM_DATABASE_URL}
      SECRET_AUTH: ${SECRET_AUTH}
      ENVIRONNEMENT: ${ENVIRONNEMENT}
    ports:
      - "8000:8000"
    networks:
      - solida
    depends_on:
      postgres-solida:
        condition: service_healthy
      postgres-coresim:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/sante')"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  coresim-seed:
    build:
      context: ./simulateur
    environment:
      DATABASE_URL: postgresql://${CORESIM_ADMIN_USER}:${CORESIM_ADMIN_PASSWORD}@postgres-coresim:5432/coresim
    networks:
      - solida
    depends_on:
      postgres-coresim:
        condition: service_healthy
    profiles:
      - tools

# Reserve a l'API (backend) a mesure qu'elle existe : minio, mlflow. Aucun n'est invente ici.
# Aucun port Postgres n'est publie vers l'hote : seul le reseau interne "solida" y a acces.

volumes:
  front_node_modules:
  front_next_cache:
  pgdata_coresim:
  pgdata_solida:

networks:
  solida:
    driver: bridge
