services:
  front:
    build:
      context: ./frontend
      target: dev
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - front_node_modules:/app/node_modules
      - front_next_cache:/app/.next
    networks:
      - solida
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/sante').then(r=>{if(!r.ok)throw 0}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  postgres-coresim:
    image: postgres:16.14
    environment:
      POSTGRES_DB: coresim
      POSTGRES_USER: ${CORESIM_ADMIN_USER}
      POSTGRES_PASSWORD: ${CORESIM_ADMIN_PASSWORD}
      SOLIDA_LECTEUR_PASSWORD: ${SOLIDA_LECTEUR_PASSWORD}
    volumes:
      - ./infra/postgres/coresim-init.sh:/docker-entrypoint-initdb.d/coresim-init.sh:ro
    networks:
      - solida
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # cap_drop/security_opt non appliques : l'entrypoint officiel Postgres a besoin de
    # CAP_CHOWN/CAP_SETUID pour demarrer en root puis basculer sur l'utilisateur postgres.
    # Isolation reelle assuree par le reseau interne (aucun port publie) et les roles a
    # privilege minimal (08-SECURITE/06 §4).
    # Volontairement non persistant (06-INFRA/02) : la base se regenere depuis la graine.

  postgres-solida:
    image: postgres:16.14
    environment:
      POSTGRES_DB: solida
      POSTGRES_USER: ${SOLIDA_APP_USER}
      POSTGRES_PASSWORD: ${SOLIDA_APP_PASSWORD}
      SOLIDA_LECTURE_PASSWORD: ${SOLIDA_LECTURE_PASSWORD}
    volumes:
      - pgdata_solida:/var/lib/postgresql/data
      - ./infra/postgres/solida-init.sh:/docker-entrypoint-initdb.d/solida-init.sh:ro
    networks:
      - solida
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  coresim-seed:
    build:
      context: ./simulateur
    environment:
      DATABASE_URL: postgresql://${CORESIM_ADMIN_USER}:${CORESIM_ADMIN_PASSWORD}@postgres-coresim:5432/coresim
    networks:
      - solida
    depends_on:
      postgres-coresim:
        condition: service_healthy
    profiles:
      - tools

# Reserve a l'API (backend) a mesure qu'elle existe : minio, mlflow
# (voir 06-INFRA/01-stack-et-justifications.md). Aucun n'est invente ici.
# Aucun port Postgres n'est publie vers l'hote : seul le reseau interne
# "solida" y a acces, conformement a 08-SECURITE/06 (isolation).

volumes:
  front_node_modules:
  front_next_cache:
  pgdata_solida:

networks:
  solida:
    driver: bridge
