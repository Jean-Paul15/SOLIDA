services:
  front:
    build:
      context: ./frontend
      target: dev
    env_file:
      - ./frontend/.env
    environment:
      BACKEND_INTERNAL_URL: http://api:8000
    volumes:
      - ./frontend:/app
      - front_node_modules:/app/node_modules
      - front_next_cache:/app/.next
    networks:
      - solida
    depends_on:
      api:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Turbopack (mode dev) peut paniquer sporadiquement sur des cycles HMR répétés (bug
    # connu de Next.js 16.3.0, pas du code applicatif) — redémarrage automatique pour
    # rester disponible sans intervention manuelle.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/sante').then(r=>{if(!r.ok)throw 0}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  postgres-coresim:
    image: postgres:16.14
    environment:
      POSTGRES_DB: coresim
      POSTGRES_USER: ${CORESIM_ADMIN_USER}
      POSTGRES_PASSWORD: ${CORESIM_ADMIN_PASSWORD}
      SOLIDA_LECTEUR_PASSWORD: ${SOLIDA_LECTEUR_PASSWORD}
    volumes:
      - pgdata_coresim:/var/lib/postgresql/data
      - ./infra/postgres/coresim-init.sh:/docker-entrypoint-initdb.d/coresim-init.sh:ro
    networks:
      - solida
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # cap_drop/security_opt non appliques : l'entrypoint officiel Postgres a besoin de
    # CAP_CHOWN/CAP_SETUID pour demarrer en root puis basculer sur l'utilisateur postgres.
    # Isolation reelle assuree par le reseau interne (aucun port publie) et les roles a
    # privilege minimal.

  postgres-solida:
    image: postgres:16.14
    environment:
      POSTGRES_DB: solida
      POSTGRES_USER: ${SOLIDA_APP_USER}
      POSTGRES_PASSWORD: ${SOLIDA_APP_PASSWORD}
      SOLIDA_LECTURE_PASSWORD: ${SOLIDA_LECTURE_PASSWORD}
    volumes:
      - pgdata_solida:/var/lib/postgresql/data
      - ./infra/postgres/solida-init.sh:/docker-entrypoint-initdb.d/solida-init.sh:ro
    networks:
      - solida
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.40
    entrypoint: ["sh", "-c"]
    command:
      - |
        mkdir -p /etc/seaweedfs && cat > /etc/seaweedfs/s3.json <<EOF
        {"identities":[{"name":"solida","credentials":[{"accessKey":"$$SEAWEEDFS_ACCESS_KEY","secretKey":"$$SEAWEEDFS_SECRET_KEY"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        EOF
        exec weed server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=256
    environment:
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY}
    volumes:
      - seaweedfs_data:/data
    networks:
      - solida
    # cap_drop non applique : /data et /etc/seaweedfs appartiennent a l'utilisateur "seaweed"
    # dans l'image, pas root — l'entrypoint (qui ecrit s3.json puis demarre "weed" en root)
    # a besoin de CAP_DAC_OVERRIDE pour y ecrire malgre tout. Meme cas que les Postgres
    # ci-dessus. Isolation reelle assuree par le reseau interne (port non publie a l'hote).

  api:
    build:
      context: ./backend
    environment:
      SOLIDA_DATABASE_URL: ${SOLIDA_DATABASE_URL}
      SOLIDA_DATABASE_URL_ASYNC: ${SOLIDA_DATABASE_URL_ASYNC}
      CORESIM_DATABASE_URL: ${CORESIM_DATABASE_URL}
      SECRET_AUTH: ${SECRET_AUTH}
      ENVIRONNEMENT: ${ENVIRONNEMENT}
      SEAWEEDFS_ENDPOINT: seaweedfs:8333
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY}
      SEAWEEDFS_BUCKET: solida-fiches
    networks:
      - solida
    depends_on:
      postgres-solida:
        condition: service_healthy
      postgres-coresim:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/sante')"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  nginx:
    image: nginx:1.30.4-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - solida
    depends_on:
      front:
        condition: service_healthy
      api:
        condition: service_healthy
    # cap_drop non applique : l'entrypoint officiel doit chown /var/cache/nginx/* vers
    # l'utilisateur nginx avant de demarrer, ce qui exige CAP_CHOWN. Meme cas que les
    # Postgres ci-dessus.
    healthcheck:
      # 127.0.0.1, pas "localhost" : wget le resout en ::1 dans l'image alpine, or nginx.conf
      # n'ecoute qu'en IPv4 (`listen 80;` sans le pendant [::]:80) — service reellement sain,
      # healthcheck faussement rouge sinon.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/v1/sante"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  coresim-seed:
    build:
      context: ./simulateur
    environment:
      DATABASE_URL: postgresql://${CORESIM_ADMIN_USER}:${CORESIM_ADMIN_PASSWORD}@postgres-coresim:5432/coresim
    networks:
      - solida
    depends_on:
      postgres-coresim:
        condition: service_healthy
    profiles:
      - tools

# Reserve a l'API (backend) a mesure qu'elle existe : mlflow. Aucun n'est invente ici.
# Seul nginx publie un port sur l'hote (80) : front et api ne sont joignables que par le
# reseau interne "solida", pareil pour postgres et seaweedfs. Pas de TLS ici (usage LAN/demo
# de hackathon assume) : a ajouter (certificat + Strict-Transport-Security) avant tout
# deploiement reel, voir docs/backend/03-decisions-provisoires-a-revoir.md.

volumes:
  front_node_modules:
  front_next_cache:
  pgdata_coresim:
  pgdata_solida:
  seaweedfs_data:

networks:
  solida:
    driver: bridge
