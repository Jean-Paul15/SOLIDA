[project]
name = "solida-modelisation"
version = "0.1.0"
description = "Construction et entrainement reproductibles du modele SOCLE SOLIDA."
requires-python = ">=3.12,<3.13"
dependencies = [
  "interpret-core==0.7.8",
  "joblib>=1.5,<2",
  "numpy==2.5.1",
  "pandas==3.0.5",
  "pyarrow==25.0.0",
  "pyyaml==6.0.3",
  "scikit-learn==1.9.1",
]

[project.optional-dependencies]
mlops = [
  "boto3>=1.42,<2",
  "dvc==3.67.1",
  "dvc-s3==3.3.0",
  "mlflow==3.16.0",
  "psycopg[binary]==3.3.4",
]
notebooks = [
  "jupyterlab>=4.4,<5",
  "matplotlib>=3.10,<4",
  "nbclient>=0.10,<1",
  "seaborn>=0.13,<1",
]
dev = [
  "mypy>=1.18,<2",
  "pandas-stubs==3.0.5.260730",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
solida-modele = "solida_modelisation.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solida_modelisation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Les fichiers Python montés depuis NTFS apparaissent exécutables dans le conteneur Linux.
# Ce n'est pas un script sans shebang : ignorer ce faux positif de montage.
ignore = ["EXE002"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["interpret", "interpret.*", "joblib", "sklearn", "sklearn.*"]
ignore_missing_imports = true
