# SOLIDA -- Generateur CORE-SIM v4 (decisions terrain J1-05 a J1-13)
graine: 42

# --- Volumetrie et temps ---
n_membres: 27000
part_emprunteurs: 0.25
date_fin: "2026-08-01"
anciennete_max_annees: 14
epargne_min_mois_avant_credit: 3
repartition_anciennete_epargne:
  mois_3_a_5: 0.15
  mois_6_a_11: 0.25
  mois_12_et_plus: 0.60

# --- Referentiels ---
n_caisses: 8
zones: [urbain, semi_urbain, rural]
zones_poids: [0.34, 0.30, 0.36]

segments:
  salarie: 0.20
  individuel: 0.32
  jeune: 0.12
  femme_gie: 0.18
  agricole: 0.18

# Calibration d'une marginale de defaut, jamais d'une performance de modele.
taux_defaut_cible: 0.09

# Variables disponibles a la date d'octroi uniquement. Age, visites, relances,
# paiements, retards, statut et defaut n'entrent jamais dans ce mecanisme.
coef_epargne_regularite: 0.85
coef_epargne_anciennete: 0.40
coef_ratio_garantie: 0.55
coef_salarie: 1.10
coef_cycle: 0.30
coef_anciennete: 0.20
coef_qualite_groupe: 0.90
coef_endettement: 0.75
seuil_endettement: 0.33
coef_dependants: 0.15
coef_rural: 0.25
coef_jeune: 0.35
coef_agricole_choc: 1.00
ecart_idiosyncratique: 1.15

# --- Choc sectoriel latent ---
secteur_autocorrelation: 0.88
secteur_choc_ecart: 0.70
secteur_episode_degradation_proba: 0.05

# --- Groupes GIE ---
taille_gie_min: 4
taille_gie_max: 15
taux_sortie_gie_annuel: 0.05

# --- Credits synthetiques ---
# Ces bornes pilotent le tirage, pas les limites metier du catalogue.
montant_synthetique_min: 20000
montant_synthetique_max: 5500000
duree_mois_choix: [3, 6, 9, 12, 18, 24]
periodicites_remboursement:
  hebdomadaire: 0.20
  mensuelle: 0.20
  trimestrielle: 0.20
  semestrielle: 0.20
  annuelle: 0.20
nantissement_taux_min: 0.10
nantissement_taux_max: 0.3333333333333333

# Le catalogue exprime l'absence de minimum metier et le plafond institutionnel.
produits:
  salarie:
    produit_id: prod-salarie
    libelle: "Virement salaire"
    type_garantie: epargne_nantie
    montant_min: 0
    montant_max: 100000000
    duree_min_mois: 3
    duree_max_mois: 24
    taux_annuel_min: 0.09
    taux_annuel_max: 0.12
  individuel:
    produit_id: prod-individuel
    libelle: "Credit PME/PMI"
    type_garantie: epargne_nantie
    montant_min: 0
    montant_max: 100000000
    duree_min_mois: 3
    duree_max_mois: 24
    taux_annuel_min: 0.14
    taux_annuel_max: 0.14
  jeune:
    produit_id: prod-jeune
    libelle: "Youth Espoir"
    type_garantie: epargne_nantie
    montant_min: 0
    montant_max: 100000000
    duree_min_mois: 3
    duree_max_mois: 24
    taux_annuel_min: 0.07
    taux_annuel_max: 0.075
  femme_gie:
    produit_id: prod-femme-gie
    libelle: "Credit Epargne avec Education (CEE)"
    type_garantie: solidaire
    montant_min: 0
    montant_max: 100000000
    duree_min_mois: 3
    duree_max_mois: 24
    taux_annuel_min: 0.16
    taux_annuel_max: 0.16
  agricole:
    produit_id: prod-agricole
    libelle: "Credit agricole"
    type_garantie: epargne_nantie
    montant_min: 0
    montant_max: 100000000
    duree_min_mois: 3
    duree_max_mois: 24
    taux_annuel_min: 0.14
    taux_annuel_max: 0.14

# --- Epargne libre ---
depot_mensuel_median: 10000
probabilite_retrait_mensuel: 0.28
types_operation_supportes: [depot, retrait, transfert_nantie, restitution_nantie, interet]
# Aucun interet n'est genere tant que son taux et sa frequence ne sont pas confirmes.
generer_interets_epargne: false

# --- Valeurs manquantes ---
manquant_revenu_rural: 0.35
manquant_revenu_urbain: 0.10
manquant_education: 0.30
